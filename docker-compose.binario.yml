services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gin-api
      - photo-database
    networks:
      - backend-network

  gin-api:
    image: debian:bookworm-slim
    container_name: gin-api
    ports:
      - "9000:9000"
    volumes:
      - ./main:/app/main:ro
      - ./config.docker.toml:/app/config.toml:ro
      - ./docs:/app/docs:ro
    working_dir: /app
    command: ./main
    depends_on:
      - photo-database
    networks:
      - backend-network
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}

  photo-database:
    image: 'postgres:17'
    container_name: photo-database
    restart: always
    tty: true
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - backend-network

networks:
  backend-network:
    driver: bridge

volumes:
  db-data:
    driver: local
